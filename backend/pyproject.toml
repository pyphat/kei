[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kei-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "ultralytics",
    "opencv-python",
    "pillow",
    "numpy",
    "manga-ocr",
    "httpx",
    "pythainlp==5.4.0",
]

[tool.setuptools.packages.find]
include = ["kei_core*", "api_fastapi*"]
